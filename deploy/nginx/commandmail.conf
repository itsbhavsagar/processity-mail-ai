# Nginx reverse proxy for CommandMail on Oracle Cloud.
# Place at /etc/nginx/sites-available/commandmail.conf and symlink into
# sites-enabled. Replace mail.example.com with your domain. TLS files are the
# paths certbot creates (see the Oracle deployment steps).

# The Next.js standalone server, published by Docker on loopback only.
upstream commandmail_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

# --- HTTP: serve the ACME challenge, redirect everything else to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name mail.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: the application ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mail.example.com;

    ssl_certificate     /etc/letsencrypt/live/mail.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Gmail bodies can be large; allow sizeable request bodies for sends.
    client_max_body_size 25m;

    # HSTS (only enable once you are sure HTTPS is permanent).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Forward the real scheme/host so NextAuth + the app build correct absolute
    # URLs behind TLS termination. NEXTAUTH_URL is still the source of truth for
    # the OAuth callback, but these headers keep everything else consistent.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Server-Sent Events endpoint (Gmail push stream): buffering MUST be off or
    # Nginx will hold the response and the client never receives live events.
    location /api/gmail/stream {
        proxy_pass http://commandmail_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Everything else.
    location / {
        proxy_pass http://commandmail_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
